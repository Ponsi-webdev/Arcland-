<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARCLAND Investments Ltd</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Source+Serif+4:wght@600;700&display=swap">
<style>
:root{--navy:#012a55;--maroon:#690103;--pale:#d3ebf5;--ink:#1c2531;--muted:#566272;--line:#dfe5ec;--bg:#f5f8fb;--wa:#128c4a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#fff;-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.6 Lato,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;color:var(--navy);line-height:1.2;margin:0}
h1{font-size:clamp(2rem,5vw,3.2rem)}h2{font-size:clamp(1.55rem,3.4vw,2.2rem)}h3{font-size:1.3rem}
:focus-visible{outline:3px solid var(--maroon);outline-offset:2px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
header{background:var(--pale);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid rgba(0,0,0,.07)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:84px}
.logo img{height:84px;width:auto}
nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0}
nav a{display:flex;align-items:center;min-height:44px;padding:0 16px;text-decoration:none;font-weight:700;color:var(--navy);border-radius:8px}
nav a:hover,nav a.on{background:#fff}
.menu{display:none;width:48px;height:48px;border:0;border-radius:8px;background:#fff;color:var(--navy);cursor:pointer;align-items:center;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:8px;border:2px solid var(--navy);background:var(--navy);color:#fff;font:700 1rem Lato,sans-serif;text-decoration:none;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.18)}
.btn.key{background:var(--maroon);border-color:var(--maroon)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.light{background:transparent;color:#fff;border-color:#fff}
.hero{background:var(--bg);padding:clamp(28px,6vw,64px) 0}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,5vw,56px);align-items:center}
.hero p{font-size:1.15rem;color:var(--muted);max-width:34em;margin:16px 0 26px}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px}
.hero figure{margin:0}
.hero figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}
section.blk{padding:clamp(40px,7vw,80px) 0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:28px}
.head p{margin:6px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,265px),1fr));gap:24px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-width:0}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover}
.tag{position:absolute;top:12px;left:12px;background:var(--maroon);color:#fff;font-weight:700;font-size:.85rem;padding:4px 12px;border-radius:999px}
.cb{display:flex;flex-direction:column;gap:8px;padding:18px;flex:1}
.loc{margin:0;color:var(--muted)}
.facts{margin:0;font-weight:700}
.feat{margin:0;font-size:.93rem;color:var(--muted)}
.price{margin:auto 0 0;padding-top:8px;color:var(--maroon);font:700 1.3rem "Source Serif 4",Georgia,serif}
.price small{display:block;font:400 .85rem Lato,sans-serif;color:var(--muted)}
.card .btn{margin-top:10px;width:100%}
.intro{background:#fff;text-align:center}
.intro p{max-width:40em;margin:14px auto 0;color:var(--muted);font-size:1.1rem}
.cta{background:var(--navy);color:#fff;text-align:center;padding:clamp(40px,7vw,72px) 0}
.cta h2{color:#fff}.cta p{max-width:34em;margin:12px auto 18px;color:#e4ebf4}
.cta .acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.wa{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;margin:12px;border-radius:999px;background:var(--wa);color:#fff;font:700 1.05rem Lato,sans-serif;text-decoration:none;animation:ring 2.4s ease-out infinite,shake 9s ease-in-out infinite}
.wa svg{width:26px;height:26px;flex:none}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%,100%{box-shadow:0 0 0 16px rgba(37,211,102,0)}}
@keyframes shake{0%,90%,100%{transform:none}92%{transform:rotate(-2deg)}94%{transform:rotate(2deg)}96%{transform:rotate(-1.5deg)}98%{transform:rotate(1deg)}}
@media (prefers-reduced-motion:reduce){.wa{animation:none}}
.pagehead{background:var(--bg);padding:clamp(28px,5vw,52px) 0}
.pagehead p{margin:8px 0 0;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.filters button{min-height:46px;padding:0 20px;border-radius:999px;border:2px solid var(--navy);background:#fff;color:var(--navy);font:700 1rem Lato,sans-serif;cursor:pointer}
.filters button.on{background:var(--navy);color:#fff}
.soon{padding:clamp(48px,9vw,110px) 0;text-align:center}
.soon p{max-width:34em;margin:14px auto 24px;color:var(--muted)}
footer{background:var(--pale);border-top:1px solid rgba(0,0,0,.07);color:var(--navy)}
.fg{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:32px;padding:40px 0 24px;align-items:start}
.fg img{height:110px;width:auto}
.fg h3{font-size:1.1rem;margin-bottom:10px}
.fg ul{list-style:none;margin:0;padding:0}
.fg li a{display:inline-flex;align-items:center;min-height:40px;text-decoration:none;font-weight:700}
.fg p{margin:0;color:#34465f}
.copy{border-top:1px solid rgba(0,0,0,.1);padding:16px 0 20px;font-size:.92rem}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.fg{grid-template-columns:1fr}}
@media (max-width:820px){
.bar{min-height:76px}.logo img{height:76px}
.menu{display:inline-flex}
nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--pale);border-bottom:1px solid rgba(0,0,0,.08);padding:8px clamp(16px,4vw,32px) 16px}
nav.open{display:block}
nav ul{flex-direction:column}
nav a{min-height:52px;font-size:1.05rem}
}
@media (max-width:520px){.hero .acts .btn,.cta .acts .btn{width:100%}.wa{width:calc(100% - 24px)}}
</style>
</head>

const P=[

{slug:"executive-home-munyonyo",title:"6-Bedroom Executive Home",loc:"Munyonyo",tag:"For Sale",type:"sale",price:"US$ 650,000",note:"Asking price, negotiable",beds:6,img:IMG.b},

const card=p=>{const f=[p.beds?p.beds+" bedrooms":"",p.size||""].filter(Boolean).join(", ");
return '<article class="card"><div class="ph"><img src="'+p.img+'" alt="'+p.title+', '+p.loc+'" loading="lazy"><span class="tag">'+p.tag+'</span></div><div class="cb"><h3>'+p.title+'</h3><p class="loc">'+p.loc+'</p>'+(f?'<p class="facts">'+f+'</p>':'')+(p.feats?'<p class="feat">'+p.feats.join(", ")+'</p>':'')+'<p class="price">'+p.price+(p.note?'<small>'+p.note+'</small>':'')+'</p><a class="btn" href="#/property/'+p.slug+'">View details</a></div></article>'};
const waBtn=m=>'<a class="wa" href="'+wa(m)+'" target="_blank" rel="noopener">'+WAI+'Chat on WhatsApp</a>';
const pages={
home:()=>'<section class="hero"><div class="wrap"><div><h1>Property for sale and rent</h1><p>Homes and commercial space in Entebbe Road, Munyonyo, Namamve and Mbuya, listed by ARCLAND Investments Ltd.</p><div class="acts"><a class="btn key" href="#/properties">View properties</a><a class="btn ghost" href="#/contact">Contact us</a></div></div><figure><img src="'+IMG.hero+'" alt="6-bedroom mansionette, Alright Estate, Entebbe Road"></figure></div></section>'+
'<section class="blk"><div class="wrap"><div class="head"><div><h2>Featured properties</h2><p>Current listings for sale and rent.</p></div><a class="btn ghost" href="#/properties">View all properties</a></div><div class="grid">'+P.map(card).join("")+'</div></div></section>'+
'<section class="blk intro"><div class="wrap"><h2>About ARCLAND Investments Ltd</h2><p>ARCLAND Investments Ltd lists residential and commercial property for sale and rent. Browse the properties above, then message us to ask about any of them.</p></div></section>'+
'<section class="cta"><div class="wrap"><h2>Interested in a property?</h2><p>Message us on WhatsApp or use the contact page, and we will send you more information.</p><div class="acts">'+waBtn("Hello ARCLAND Investments Ltd, I would like to make an enquiry.")+'<a class="btn light" href="#/contact">Go to contact page</a></div></div></section>',
properties:()=>'<section class="pagehead"><div class="wrap"><h1>Our properties</h1><p>Houses for sale, homes to let and commercial space.</p></div></section><section class="blk" style="padding-top:32px"><div class="wrap"><div class="filters" role="group" aria-label="Filter properties"><button data-f="all" class="on">All</button><button data-f="sale">For sale</button><button data-f="rent">For rent</button></div><div class="grid" id="pg">'+P.map(card).join("")+'</div></div></section>',
soon:t=>'<section class="soon"><div class="wrap"><h1>'+t+'</h1><p>This page will be built in the next stage, after you review the homepage and Properties page.</p><a class="btn" href="#/properties">Back to properties</a></div></section>'
};
const nm={about:"About",contact:"Contact"};
function route(){const h=location.hash.replace(/^#\/?/,"").split("/");const r=h[0]||"home";let k=r,html;
if(r==="home"||r==="properties")html=pages[r]();
else if(r==="property"){const p=P.find(x=>x.slug===h[1]);html=pages.soon(p?p.title:"Property");k="properties"}
else html=pages.soon(nm[r]||"Page");
document.getElementById("app").innerHTML=html;
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===k));
document.getElementById("nav").classList.remove("open");document.getElementById("menu").setAttribute("aria-expanded","false");
window.scrollTo(0,0);
const pg=document.getElementById("pg");
if(pg)document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filters button").forEach(x=>x.classList.toggle("on",x===b));pg.innerHTML=P.filter(p=>b.dataset.f==="all"||p.type===b.dataset.f).map(card).join("")})}
document.getElementById("menu").onclick=function(){const o=document.getElementById("nav").classList.toggle("open");this.setAttribute("aria-expanded",o)};
addEventListener("hashchange",route);route();
</script>
