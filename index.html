<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARCLAND Investments Ltd</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Source+Serif+4:wght@500;600&display=swap">
<style>
:root{--navy:#012a55;--maroon:#690103;--pale:#d3ebf5;--ink:#1c2531;--muted:#5a6676;--line:#e2e8ef;--bg:#f6f9fc;--wa:#128c4a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#fff;-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.65 Lato,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:500;color:var(--navy);line-height:1.18;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5.4vw,3.8rem)}h2{font-size:clamp(1.65rem,3.4vw,2.35rem)}h3{font-size:1.45rem}
:focus-visible{outline:3px solid var(--maroon);outline-offset:3px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,36px)}
header{background:var(--pale);position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid rgba(0,0,0,.07)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:84px}
.logo img{height:84px;width:auto}
nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0}
nav a{display:flex;align-items:center;min-height:44px;padding:0 16px;text-decoration:none;font-weight:700;color:var(--navy);border-radius:8px;transition:background .25s}
nav a:hover,nav a.on{background:#fff}
.menu{display:none;width:48px;height:48px;border:0;border-radius:8px;background:#fff;color:var(--navy);cursor:pointer;align-items:center;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border-radius:8px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;font:700 1rem Lato,sans-serif;text-decoration:none;cursor:pointer;text-align:center;transition:transform .2s,box-shadow .25s,background .25s}
.btn:hover{box-shadow:0 8px 20px -8px color-mix(in srgb,var(--navy) 60%,transparent);transform:translateY(-1px);background:color-mix(in srgb,var(--navy) 88%,#fff)}
.btn:active{transform:scale(.98);box-shadow:none}
.btn.key{background:var(--maroon);border-color:var(--maroon)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.ghost:hover{background:var(--navy);color:#fff}
.btn.light{background:transparent;color:#fff;border-color:rgba(255,255,255,.8)}
.btn.light:hover{background:#fff;color:var(--navy)}
.hero{position:relative;overflow:hidden;min-height:clamp(540px,84vh,780px);display:flex;align-items:flex-end;background:var(--navy)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%;transform-origin:60% 60%;animation:zoom 30s ease-out forwards}
@keyframes zoom{to{transform:scale(1.07)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--navy) 70%,transparent),color-mix(in srgb,var(--navy) 22%,transparent) 55%,transparent),linear-gradient(0deg,color-mix(in srgb,var(--navy) 40%,transparent),transparent 45%)}
.hero .wrap{position:relative;z-index:2;padding-bottom:clamp(36px,8vw,84px);padding-top:80px}
.hero h1{color:#fff;max-width:13em}
.hero p{color:#eaf1f8;font-size:clamp(1.05rem,2vw,1.2rem);max-width:33em;margin:18px 0 28px}
.hero .acts{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hero .wa{margin:0}
section.blk{padding:clamp(52px,8vw,100px) 0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:clamp(26px,4vw,44px)}
.head p{margin:8px 0 0;color:var(--muted);max-width:32em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:clamp(24px,3.4vw,40px)}
.card{display:flex;flex-direction:column;min-width:0;background:#fff;border:1px solid var(--line);overflow:hidden;transition:transform .35s ease,box-shadow .35s ease;border-radius:14px}
.ph{position:relative;overflow:hidden;background:var(--bg)}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .8s ease}
.tag{position:absolute;top:16px;left:16px;background:var(--maroon);color:#fff;font-weight:700;font-size:.88rem;padding:5px 14px;border-radius:999px}
.cb{display:flex;flex-direction:column;gap:6px;padding:24px;flex:1}
.loc{margin:0;color:var(--muted)}
.desc{margin:6px 0 0;color:#3b4757}
.facts{margin:6px 0 0;font-weight:700;color:var(--navy)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-top:auto;padding-top:18px}
.price{margin:0;color:var(--maroon);font:600 1.9rem "Source Serif 4",Georgia,serif;line-height:1.2}
.price small{display:block;font:400 .88rem Lato,sans-serif;color:var(--muted)}
@media (hover:hover){.card:hover{transform:translateY(-6px)}.card:hover .ph img{transform:scale(1.045)}.card:hover{box-shadow:0 26px 44px -24px color-mix(in srgb,var(--navy) 50%,transparent)}}
.why{background:var(--bg)}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.wc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 28px}
.wc svg{width:36px;height:36px;color:var(--navy)}
.wc h3{margin:18px 0 8px;font-size:1.3rem}.wc p{margin:0;color:var(--muted)}
.faq{max-width:820px;margin:0 auto}
.faq h2{margin-bottom:18px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px;cursor:pointer;font:500 1.2rem "Source Serif 4",Georgia,serif;color:var(--navy);list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:400 1.7rem Lato,sans-serif;color:var(--maroon);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin:0 0 22px;color:var(--muted)}
.where{background:var(--bg);text-align:center}
.where p.lead{max-width:36em;margin:14px auto 0;color:var(--muted);font-size:1.1rem}
.locs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:36px 0 0;padding:0;list-style:none}
.locs li{padding:18px 8px;border-top:2px solid var(--navy);font:500 1.2rem "Source Serif 4",Georgia,serif;color:var(--navy)}
.cta{background:var(--navy);color:#fff;text-align:center;padding:clamp(52px,8vw,92px) 0}
.cta h2{color:#fff}.cta p{max-width:32em;margin:14px auto 24px;color:#dfe8f3}
.cta .acts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.cta .wa{margin:0}
.wa{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;margin:12px;border-radius:999px;background:var(--wa);color:#fff;font:700 1rem Lato,sans-serif;text-decoration:none;transition:filter .25s;animation:ring 3s ease-out infinite,shake 12s ease-in-out infinite}
.wa:hover{filter:brightness(1.1)}.wa:active{transform:scale(.98)}
.wa svg{width:24px;height:24px;flex:none}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(37,211,102,.5)}70%,100%{box-shadow:0 0 0 14px rgba(37,211,102,0)}}
@keyframes shake{0%,92%,100%{transform:none}94%{transform:rotate(-1.6deg)}96%{transform:rotate(1.6deg)}98%{transform:rotate(-1deg)}}
.pagehead{background:var(--bg);padding:clamp(36px,6vw,68px) 0}
.pagehead p{margin:10px 0 0;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:clamp(26px,4vw,40px)}
.filters button{min-height:46px;padding:0 22px;border-radius:999px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font:700 1rem Lato,sans-serif;cursor:pointer;transition:background .25s,color .25s}
.filters button.on,.filters button:hover{background:var(--navy);color:#fff}
.rv{opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
.soon{padding:clamp(56px,10vw,120px) 0;text-align:center}
.soon p{max-width:34em;margin:14px auto 26px;color:var(--muted)}
footer{background:var(--pale);border-top:1px solid rgba(0,0,0,.07);color:var(--navy)}
.fg{display:grid;grid-template-columns:1.2fr 1fr 1.2fr;gap:32px;padding:44px 0 26px;align-items:start}
.fg img{height:110px;width:auto}
.fg h3{font-size:1.1rem;margin-bottom:10px}
.fg ul{list-style:none;margin:0;padding:0}
.fg li a{display:inline-flex;align-items:center;min-height:40px;text-decoration:none;font-weight:700}
.fg p{margin:0;color:#34465f}
.copy{border-top:1px solid rgba(0,0,0,.1);padding:16px 0 22px;font-size:.92rem}
@media (max-width:900px){.wg{grid-template-columns:1fr}.locs{grid-template-columns:repeat(2,1fr)}.fg{grid-template-columns:1fr}}
@media (max-width:820px){
.bar{min-height:76px}.logo img{height:76px}
.menu{display:inline-flex}
nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--pale);border-bottom:1px solid rgba(0,0,0,.08);padding:8px clamp(18px,4vw,36px) 16px}
nav.open{display:block}
nav ul{flex-direction:column}
nav a{min-height:52px;font-size:1.05rem}
}
@media (max-width:520px){.hero .acts>*,.cta .acts>*{width:100%}.hero::after{background:linear-gradient(0deg,color-mix(in srgb,var(--navy) 80%,transparent),color-mix(in srgb,var(--navy) 18%,transparent) 65%,transparent)}.locs{grid-template-columns:1fr}.row .btn{width:100%}}
@media (prefers-reduced-motion:reduce){.hero>img,.wa{animation:none}.rv{opacity:1;transform:none;transition:none}.card,.ph img{transition:none}}
</style>
</head>

home:()=>'<section class="hero"><img src="'+IMG.h+'" alt="Living area with timber floor and staircase, 4-bedroom house, Mbuya" fetchpriority="high"><div class="wrap"><h1>Property that fits the way you live and work</h1><p>ARCLAND offers residential and commercial property for sale and rent in prime Kampala-area locations.</p><div class="acts"><a class="btn key" href="#/properties">View Properties</a>'+waBtn(ENQ)+'</div></div></section>'+

'<section class="blk"><div class="wrap"><div class="head rv"><div><h2>Featured properties</h2><p>Our current listings for sale and rent.</p></div><a class="btn ghost" href="#/properties">View all properties</a></div><div class="grid">'+P.map(card).join("")+'</div></div></section>'+
'<section class="blk where"><div class="wrap rv"><h2>Where we list</h2><p class="lead">ARCLAND Investments Ltd lists residential and commercial property for sale and rent.</p><ul class="locs"><li>Entebbe Road</li><li>Munyonyo</li><li>Namamve</li><li>Mbuya</li></ul></div></section>'+
'<section class="blk"><div class="wrap rv"><div class="faq"><h2>Frequently asked questions</h2><details><summary>Can I arrange a viewing?</summary><p>Yes. Send a WhatsApp enquiry and ARCLAND will arrange a suitable time.</p></details><details><summary>Can I ask about a specific property?</summary><p>Yes. Use the WhatsApp button on that property&rsquo;s page.</p></details><details><summary>Does ARCLAND have properties for sale and rent?</summary><p>Yes. ARCLAND lists residential and commercial property.</p></details></div></div></section>'+

const nm={about:"About",contact:"Contact"};
let io=null;
function reveal(){if(!("IntersectionObserver"in window)){document.querySelectorAll(".rv").forEach(e=>e.classList.add("in"));return}
if(io)io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12,rootMargin:"0px 0px -40px 0px"});
document.querySelectorAll(".rv:not(.in)").forEach(e=>io.observe(e))}
function route(){const h=location.hash.replace(/^#\/?/,"").split("/");const r=h[0]||"home";let k=r,html;
if(r==="home"||r==="properties")html=pages[r]();
else if(r==="property"){const p=P.find(x=>x.slug===h[1]);html=pages.soon(p?p.title:"Property");k="properties"}
else html=pages.soon(nm[r]||"Page");
document.getElementById("app").innerHTML=html;
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===k));
document.getElementById("nav").classList.remove("open");document.getElementById("menu").setAttribute("aria-expanded","false");
window.scrollTo(0,0);reveal();
const pg=document.getElementById("pg");
if(pg)document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filters button").forEach(x=>x.classList.toggle("on",x===b));pg.innerHTML=P.filter(p=>b.dataset.f==="all"||p.type===b.dataset.f).map(card).join("");reveal()})}
document.getElementById("menu").onclick=function(){const o=document.getElementById("nav").classList.toggle("open");this.setAttribute("aria-expanded",o)};
addEventListener("hashchange",route);route();
